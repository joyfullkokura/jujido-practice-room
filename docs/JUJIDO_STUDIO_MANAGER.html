<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUJIDO STUDIO MANAGER</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#1e293b;background:#f1f5f9}
#app{display:flex;min-height:100vh}nav{width:200px;background:#0f2a5c;color:#fff;padding:12px;flex-shrink:0}nav h1{font-size:15px;margin:0 0 2px}nav small{opacity:.7;font-size:11px;display:block;margin-bottom:12px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:12px;margin:2px 0;border-radius:8px;font-size:15px;cursor:pointer}nav button.on,nav button:hover{background:#2563eb}
main{flex:1;padding:14px;min-width:0}button,select,input,textarea{font:inherit}.btn{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}.btn.g{background:#e2e8f0;color:#0f2a5c}.btn.r{background:#dc2626}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.bar button{padding:8px 14px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}.card h3{margin:0 0 8px;color:#0f2a5c;font-size:16px}
.grid{overflow-x:auto;background:#fff;border-radius:12px;padding:6px}.row{display:flex;border-bottom:1px solid #e2e8f0}.rn{width:110px;flex-shrink:0;padding:4px 6px;font-weight:700;color:#0f2a5c;position:sticky;left:0;background:#fff;z-index:3}.rn small{display:block;font-weight:400;font-size:10px;color:#64748b;line-height:1.2;max-height:24px;overflow:hidden}
.tl{position:relative;display:flex;height:52px;width:960px;flex-shrink:0}.tl.h{height:24px}.tl .c{width:40px;border-left:1px solid #e2e8f0;cursor:pointer}.tl .c:nth-child(2n+1){border-left-color:#94a3b8}.c.off{background:#e5e7eb}.hl{width:80px;font-size:11px;color:#475569;padding-left:2px}
.b{position:absolute;top:2px;height:48px;color:#fff;font-size:11px;line-height:1.2;padding:3px 5px;border-radius:6px;overflow:hidden;cursor:pointer;z-index:2}.nl{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:4}
.legend span{display:inline-block;margin:2px 8px 2px 0;font-size:12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:3px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kpi div{background:#fff;border-radius:12px;padding:12px;border-left:5px solid #2563eb}.kpi b{font-size:21px;color:#0f2a5c;display:block}.kpi small{color:#64748b}
.bw{background:#e2e8f0;border-radius:6px;height:16px;position:relative;margin:3px 0}.bw i{display:block;height:100%;border-radius:6px;background:#93c5fd}.bw u{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:#1d4ed8}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:6px;text-align:left}th{background:#eff6ff;color:#0f2a5c}td input,td select{width:100%;min-width:60px}
.hm{display:grid;grid-template-columns:30px repeat(12,1fr);gap:2px;font-size:11px;text-align:center}.hm div{padding:6px 0;border-radius:4px}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:10px}.md{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:560px}
.md label{display:block;font-size:12px;color:#475569;margin-top:8px}.md input,.md select,.md textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{background:#eff6ff;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}.warn{color:#b91c1c;font-weight:700}.note{background:#fef3c7;border-radius:8px;padding:8px;font-size:13px}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:6px}nav h1,nav small{display:none}nav button{white-space:nowrap;width:auto}}
@media print{nav,.bar,.noprint{display:none!important}body{background:#fff}main{padding:0}}
</style></head><body><div id="app"></div>
<script>
const CATS={lesson:['通常レッスン','#2563eb'],rental:['一般貸出','#16a34a'],pass:['月イチ楽器パスポート','#f97316'],trial:['無料体験','#eab308'],event:['イベント・発表会','#9333ea'],internal:['社内利用','#6b7280'],maint:['メンテナンス・停止','#dc2626']};
const ST={tent:'仮予約',confirm:'確定',used:'利用済み',cancel:'キャンセル'},PAY={unpaid:'未払い',paid:'支払済み',free:'無料'},K='jujido_studio_v1',W='日月火水木金土';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP'),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fd(d)},jd=s=>{const d=pd(s);return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${W[d.getDay()]})`};
const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0'),tm=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}),nowM=()=>{const[h,m]=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Tokyo',hour12:false}).split(':');return+h*60+ +m};
const pct=(a,b)=>b>0?(a/b*100).toFixed(1)+'%':'-',uid=()=>Math.random().toString(36).slice(2,10);
function init(){let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
const R0=[['L-1','アップライトピアノ'],['M-3','グランドピアノ、ステージア ELS-01C'],['L-2','アップライトピアノ、ステージア ELS-02C、ELS-03X'],['S-5','グランドピアノ'],['M-2','グランドピアノ'],['M-1','アップライトピアノ、ステージア ELS-02C'],['S-6','グランドピアノ、アップライトピアノ'],['ホール','グランドピアノ']];
const s={rooms:R0.map(([name,inst])=>({name,inst,cap:name=='ホール'?30:4,hall:name=='ホール',goal:40,rgoal:20000})),cfg:{base:1000,add:100,hall:1500,tax:10,closed:[],extras:[{n:'グランドピアノ',p:0,m:'h'},{n:'マリンバ',p:0,m:'h'},{n:'ドラムセット',p:0,m:'h'},{n:'その他打楽器',p:0,m:'k'}]},bk:[],log:[]};
const t=today();for(let o=-40;o<=14;o++){const d=addD(t,o),w=pd(d).getDay();if(w==0)continue;for(let i=0;i<7;i++){const slots=w==6?[600,660,720,780,840]:[960,1020,1080,1140];slots.forEach(x=>{const q=r();if(q<.4)s.bk.push({id:uid(),date:d,room:i,s:x,e:x+60,cat:q<.05?'pass':'lesson',name:'生徒'+Math.ceil(r()*40),teacher:['高山','三吉','戸嶋'][i%3],pp:1,st:d<t?'used':'confirm',pay:'free',sample:1});else if(q<.5)s.bk.push({id:uid(),date:d,room:i,s:x,e:x+60+(r()<.4?60:0),cat:'rental',name:'団体'+Math.ceil(r()*9),pp:1+Math.floor(r()*4),st:d<t?'used':'confirm',pay:r()<.7?'paid':'unpaid',sample:1})})}
s.bk.push({id:uid(),date:d,room:7,s:780,e:900,cat:w==6?'event':'rental',name:'ホール利用',pp:10,ex:['グランドピアノ'],st:d<t?'used':'confirm',pay:'unpaid',sample:1})}return s}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||init();const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('保存に失敗しました。バックアップを取得してください')}};
let V='sched',D=today(),M=D.slice(0,7),SR=null;
const hours=s=>{if(S.cfg.closed.includes(s))return null;const w=pd(s).getDay();return w==0?[540,1020]:w==6?[540,1080]:[570,1110]};
function calc(b){const c=S.cfg,h=(b.e-b.s)/60;let base=0,ex=0;if(b.cat=='rental'){const hl=S.rooms[b.room].hall;base=hl?c.hall*h:(c.base+Math.max(0,b.pp-1)*c.add)*h;if(hl)(b.ex||[]).forEach(n=>{const x=c.extras.find(e=>e.n==n);if(x)ex+=x.p*(x.m=='h'?h:1)})}
base=Math.round(base);ex=Math.round(ex);let net=b.adj!=null&&b.adj!==''?+b.adj:base+ex-(+b.disc||0);net=Math.max(0,net);const tax=Math.round(net*c.tax/100);return{base,ex,net,tax,tot:net+tax}}
const conf=b=>S.bk.filter(x=>!x.del&&x.st!='cancel'&&x.id!=b.id&&x.date==b.date&&x.room==b.room&&x.s<b.e&&b.s<x.e);
const log=m=>{S.log.unshift(new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' '+m);S.log=S.log.slice(0,200)};
function render(){const N=[['dash','ダッシュボード'],['sched','教室予約表'],['new','新規予約'],['search','空き教室検索'],['rec','定期レッスン'],['sales','売上管理'],['dash','稼働率分析'],['rep','レポート'],['set','各種設定']];
$('#app').innerHTML=`<nav><h1>JUJIDO STUDIO MANAGER</h1><small>下関十字堂楽器店 教室稼働管理システム</small>${N.map(([k,l])=>`<button class="${V==k&&l!='稼働率分析'?'on':''}" onclick="nav('${k}')">${l}</button>`).join('')}</nav><main>${S.bk.some(b=>b.sample)?'<div class="note noprint">サンプルデータが含まれています(設定画面で一括削除できます)</div>':''}${VIEWS[V]()}</main>`}
function nav(k){if(k=='new')return nb(D,0,600);if(k=='rec')return nb(D,0,960,1);V=k;render()}
const VIEWS={sched(){const hr=hours(D),t=today();let h=`<div class="bar"><button onclick="D=addD(D,-1);render()">◀</button><b>${jd(D)}</b><button onclick="D=addD(D,1);render()">▶</button><button onclick="D=today();render()">今日</button><input type="date" value="${D}" onchange="D=this.value||D;render()">${hr?'':'<span class="warn">休業日</span>'}</div><div class="legend card">${Object.values(CATS).map(c=>`<span><i style="background:${c[1]}"></i>${c[0]}</span>`).join('')}<span><i style="background:#e5e7eb"></i>店舗営業時間外</span></div><div class="grid"><div class="row"><div class="rn"></div><div class="tl h">${Array.from({length:12},(_,k)=>`<div class="hl">${9+k}:00</div>`).join('')}</div></div>`;
h+=S.rooms.map((r,i)=>{let c='';for(let k=0;k<24;k++){const m=540+k*30,off=!hr||m<hr[0]||m>=hr[1];c+=`<i class="c${off?' off':''}" onclick="nb('${D}',${i},${m})"></i>`}
const bl=S.bk.filter(b=>!b.del&&b.date==D&&b.room==i&&b.st!='cancel').map(b=>`<div class="b" style="left:${(b.s-540)*4/3}px;width:${(b.e-b.s)*4/3-2}px;background:${CATS[b.cat][1]}${b.st=='tent'?';opacity:.6':''}" onclick="eb('${b.id}')">${hm(b.s)}-${hm(b.e)}<br>${esc(b.name)}</div>`).join('');
const nl=D==t&&nowM()>=540&&nowM()<1260?`<div class="nl" style="left:${(nowM()-540)*4/3}px"></div>`:'';return`<div class="row"><div class="rn">${esc(r.name)}<small>${esc(r.inst)}</small></div><div class="tl">${c}${bl}${nl}</div></div>`}).join('');return h+'</div><p class="noprint" style="font-size:12px;color:#64748b">空きマスをタップで予約登録、予約ブロックをタップで編集。</p>'},
dash(){const a=stats(M),T=a.st.reduce((o,x)=>{for(const k in x)o[k]=(o[k]||0)+x[k];return o},{}),pm=(()=>{const d=pd(M+'-01');d.setMonth(d.getMonth()-1);return fd(d).slice(0,7)})(),py=(+M.slice(0,4)-1)+M.slice(4),b=stats(pm),c=stats(py);
const rt=x=>{const t=x.st.reduce((o,y)=>{for(const k in y)o[k]=(o[k]||0)+y[k];return o},{});return t.p/(t.a||1)*100},cmp=(v,w)=>w.rev.tot||w.st[0].p?`${(v-0).toFixed(1)}%(差 ${(v-rt(w)).toFixed(1)}pt)`:'データなし';
const ct=Object.values(a.cat).reduce((x,y)=>x+y,0);
return`<div class="bar"><input type="month" value="${M}" onchange="M=this.value||M;render()"><button onclick="window.print()">印刷/PDF保存</button></div><div class="kpi"><div><small>稼働率(予定)</small><b>${pct(T.p,T.a)}</b><small>実績 ${pct(T.x,T.a)}</small></div><div><small>営業時間内 / 時間外</small><b>${pct(T.pi,T.ai)} / ${pct(T.p-T.pi,T.a-T.ai)}</b></div><div><small>総利用時間 / 空き時間</small><b>${(T.p/60).toFixed(0)}h / ${((T.a-T.p)/60).toFixed(0)}h</b></div><div><small>貸出売上(税込)・${a.rev.cnt}件</small><b>${yen(a.rev.tot)}</b></div><div><small>入金済 / 未収</small><b>${yen(a.rev.paid)} / ${yen(a.rev.un)}</b></div></div>
<div class="card"><h3>前月・前年同月比(予定稼働率)</h3>前月:${cmp(rt(a),b)}　前年同月:${cmp(rt(a),c)}</div>
<div class="card"><h3>部屋別稼働率(濃:実績 / 薄:予定)と目標達成率</h3>${S.rooms.map((r,i)=>{const o=a.st[i],p=o.p/(o.a||1)*100;return`<div>${esc(r.name)}　予定${pct(o.p,o.a)}・実績${pct(o.x,o.a)}・目標${r.goal}%→達成率${(p/(r.goal||1)*100).toFixed(0)}%　貸出売上${yen(a.rr[i])}(目標${yen(r.rgoal)})</div><div class="bw"><i style="width:${Math.min(100,p)}%"></i><u style="width:${Math.min(100,o.x/(o.a||1)*100)}%"></u></div>`}).join('')}</div>
<div class="card"><h3>予約区分別利用時間</h3>${Object.entries(CATS).filter(k=>k[0]!='maint').map(([k,v])=>{const m=a.cat[k]||0;return`<div>${v[0]}:${(m/60).toFixed(1)}h(${pct(m,ct)})</div><div class="bw"><u style="width:${ct?m/ct*100:0}%;background:${v[1]}"></u></div>`}).join('')}</div>
<div class="card"><h3>曜日×時間帯ヒートマップ(濃いほど稼働、薄い=空き)</h3><div class="hm"><div></div>${Array.from({length:12},(_,k)=>`<div>${9+k}</div>`).join('')}${[1,2,3,4,5,6,0].map(w=>{const n=a.days.filter(d=>pd(d).getDay()==w).length;return`<div>${W[w]}</div>`+a.hm2[w].map(v=>{const p=n?v/(S.rooms.length*60*n):0;return`<div style="background:rgba(29,78,216,${p.toFixed(2)});color:${p>.5?'#fff':'#334'}">${Math.round(p*100)}</div>`}).join('')}).join('')}</div></div>
<div class="card"><h3>貸出売上ランキング</h3>${S.rooms.map((r,i)=>[r.name,a.rr[i]]).sort((x,y)=>y[1]-x[1]).map((x,i)=>`<div>${i+1}. ${esc(x[0])}　${yen(x[1])}</div>`).join('')}</div>`},
search(){const q=SR||{date:D,s:'10:00',d:60,pp:1,k:''};let res='';if(SR){res=`<table><tr><th>部屋</th><th>設備</th><th>料金(税込)</th><th></th></tr>`+S.rooms.map((r,i)=>({r,i})).filter(({r,i})=>(!q.k||(q.k=='ホール'?r.hall:r.inst.includes(q.k)))&&r.cap>=q.pp&&!conf({id:0,date:q.date,room:i,s:tm(q.s),e:tm(q.s)+ +q.d})).filter(({i})=>tm(q.s)+ +q.d<=1260).map(({r,i})=>{const c=calc({cat:'rental',room:i,s:tm(q.s),e:tm(q.s)+ +q.d,pp:+q.pp,ex:[]});return`<tr><td>${esc(r.name)}</td><td>${esc(r.inst)}</td><td>${yen(c.tot)}</td><td><button class="btn" onclick="nb('${q.date}',${i},${tm(q.s)},0,'rental',${q.d},${q.pp})">予約</button></td></tr>`}).join('')+'</table>'}
return`<div class="card"><h3>空き教室検索</h3><div class="two"><div><label>希望日</label><input id="q_date" type="date" value="${q.date}"></div><div><label>開始時間</label><input id="q_s" type="time" step="900" value="${q.s}"></div><div><label>利用時間(分)</label><input id="q_d" type="number" step="15" value="${q.d}"></div><div><label>人数</label><input id="q_pp" type="number" min="1" value="${q.pp}"></div></div><label>楽器・設備</label><select id="q_k">${['','グランドピアノ','アップライトピアノ','ステージア','ホール'].map(x=>`<option ${q.k==x?'selected':''}>${x}</option>`).join('')}</select><p><button class="btn" onclick="SR={date:$('#q_date').value,s:$('#q_s').value,d:$('#q_d').value,pp:+$('#q_pp').value,k:$('#q_k').value};render()">検索</button></p>${res}${SR&&!res.includes('<td>')?'<p class="warn">該当する空き教室はありません</p>':''}</div>`},
sales(){const l=S.bk.filter(b=>!b.del&&b.cat=='rental'&&b.st!='cancel'&&b.date.startsWith(M)).sort((a,b)=>a.date<b.date?-1:1);return`<div class="bar"><input type="month" value="${M}" onchange="M=this.value||M;render()"><button onclick="csv()">CSV出力(全予約)</button></div><div class="card"><h3>貸出売上一覧(未払いは赤)</h3><div style="overflow-x:auto"><table><tr><th>日付</th><th>部屋</th><th>利用者</th><th>税抜</th><th>税込</th><th>支払</th></tr>${l.map(b=>{const c=calc(b);return`<tr><td>${b.date.slice(5)}</td><td>${esc(S.rooms[b.room].name)}</td><td>${esc(b.name)}</td><td>${yen(c.net)}</td><td>${yen(c.tot)}</td><td><select onchange="setPay('${b.id}',this.value)" style="${b.pay=='unpaid'?'color:#b91c1c':''}">${Object.entries(PAY).map(([k,v])=>`<option value="${k}" ${b.pay==k?'selected':''}>${v}</option>`).join('')}</select></td></tr>`}).join('')}</table></div><p><b>合計(税込):${yen(l.reduce((s,b)=>s+calc(b).tot,0))}</b></p></div>`},
rep(){const l=S.bk.filter(b=>!b.del&&b.date==D&&b.st!='cancel').sort((a,b)=>a.s-b.s);return`<div class="bar"><input type="date" value="${D}" onchange="D=this.value||D;render()"><button onclick="window.print()">印刷/PDF保存</button></div><div class="card"><h3>${jd(D)} 教室利用予定表</h3><table><tr><th>時間</th><th>部屋</th><th>区分</th><th>利用者</th><th>講師</th></tr>${l.map(b=>`<tr><td>${hm(b.s)}-${hm(b.e)}</td><td>${esc(S.rooms[b.room].name)}</td><td>${CATS[b.cat][0]}</td><td>${esc(b.name)}</td><td>${esc(b.teacher||'')}</td></tr>`).join('')}</table></div><p class="noprint">月次レポートは「ダッシュボード」を印刷してください。</p>`},
set(){const c=S.cfg,n=(l,k)=>`<label>${l}</label><input type="number" value="${c[k]}" onchange="S.cfg.${k}=+this.value;save()">`;return`<div class="card"><h3>料金設定</h3><div class="two"><div>${n('一般教室 基本料金(円/時・税抜)','base')}</div><div>${n('2人目以降 追加(円/人/時)','add')}</div><div>${n('ホール 基本料金(円/時・税抜)','hall')}</div><div>${n('消費税率(%)','tax')}</div></div><h3 style="margin-top:12px">ホール 楽器追加料金</h3><table>${c.extras.map((x,i)=>`<tr><td><input value="${esc(x.n)}" onchange="S.cfg.extras[${i}].n=this.value;save()"></td><td><input type="number" value="${x.p}" onchange="S.cfg.extras[${i}].p=+this.value;save()"></td><td><select onchange="S.cfg.extras[${i}].m=this.value;save()"><option value="h" ${x.m=='h'?'selected':''}>1時間あたり</option><option value="k" ${x.m=='k'?'selected':''}>1回あたり</option></select></td><td><button onclick="S.cfg.extras.splice(${i},1);save();render()">削除</button></td></tr>`).join('')}</table><button class="btn g" onclick="S.cfg.extras.push({n:'新規楽器',p:0,m:'h'});save();render()">＋楽器追加</button></div>
<div class="card"><h3>教室マスター</h3><div style="overflow-x:auto"><table><tr><th>名称</th><th>常設楽器</th><th>定員</th><th>目標稼働%</th><th>貸出売上目標</th></tr>${S.rooms.map((r,i)=>`<tr><td><input value="${esc(r.name)}" onchange="S.rooms[${i}].name=this.value;save()"></td><td><input value="${esc(r.inst)}" onchange="S.rooms[${i}].inst=this.value;save()"></td><td><input type="number" value="${r.cap}" onchange="S.rooms[${i}].cap=+this.value;save()"></td><td><input type="number" value="${r.goal}" onchange="S.rooms[${i}].goal=+this.value;save()"></td><td><input type="number" value="${r.rgoal}" onchange="S.rooms[${i}].rgoal=+this.value;save()"></td></tr>`).join('')}</table></div></div>
<div class="card"><h3>休業日・臨時休業日(1行1日付 YYYY-MM-DD)</h3><textarea rows="3" style="width:100%" onchange="S.cfg.closed=this.value.split(/\\s+/).filter(Boolean);save()">${c.closed.join('\n')}</textarea></div>
<div class="card"><h3>データ管理</h3><button class="btn" onclick="backup()">バックアップ保存(JSON)</button> <label class="btn g" style="display:inline-block">復元<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label> <button class="btn r" onclick="if(confirm('サンプルデータを全て削除しますか?')){S.bk=S.bk.filter(b=>!b.sample);save();render()}">サンプルデータ一括削除</button><p class="note">データはこの端末のブラウザ内にのみ保存されます。定期的にバックアップを保存してください。</p></div>
<div class="card"><h3>未実装機能(試作版)</h3>ログイン認証・権限区分・複数端末共有・同時予約防止(サーバー側)/ドラッグ移動 / 週間・月間表示 / CSVインポート / 以降一括変更 / 振替管理 / 絞り込み / 月イチ会費の重複排除集計</div>
<div class="card"><h3>変更履歴</h3><div style="max-height:160px;overflow:auto;font-size:12px">${S.log.map(esc).join('<br>')}</div></div>`}};
function stats(m){const[y,mo]=m.split('-').map(Number),n=new Date(y,mo,0).getDate(),st=S.rooms.map(()=>({a:0,ai:0,p:0,pi:0,x:0})),cat={},rev={paid:0,un:0,tot:0,cnt:0},rr=S.rooms.map(()=>0),hm2=Array.from({length:7},()=>Array(12).fill(0)),days=[];
for(let d=1;d<=n;d++){const s=m+'-'+String(d).padStart(2,'0'),h=hours(s);if(!h)continue;days.push(s);st.forEach(o=>{o.a+=720;o.ai+=h[1]-h[0]})}
S.bk.forEach(b=>{if(b.del||b.st=='cancel'||!days.includes(b.date)||!st[b.room])return;const o=st[b.room],h=hours(b.date),len=b.e-b.s,inn=Math.max(0,Math.min(b.e,h[1])-Math.max(b.s,h[0]));if(b.cat=='maint'){o.a-=len;o.ai-=inn;return}
o.p+=len;o.pi+=inn;if(b.st=='used')o.x+=len;cat[b.cat]=(cat[b.cat]||0)+len;if(b.cat=='rental'){const c=calc(b);rev.cnt++;rev.tot+=c.tot;if(b.pay=='paid')rev.paid+=c.tot;if(b.pay=='unpaid')rev.un+=c.tot;rr[b.room]+=c.tot}
const w=pd(b.date).getDay();for(let t=Math.floor(b.s/60);t<Math.ceil(b.e/60);t++)if(t>=9&&t<21)hm2[w][t-9]+=Math.min(b.e,t*60+60)-Math.max(b.s,t*60)});return{st,cat,rev,rr,hm2,days}}
function setPay(id,v){const b=S.bk.find(x=>x.id==id);b.pay=v;log('支払状況変更 '+b.name+' → '+PAY[v]);save();render()}
function nb(date,room,s,rec,cat,d,pp){modal({date,room,s,e:s+(d||60),cat:cat||'lesson',pp:pp||1,st:'confirm',pay:cat=='rental'?'unpaid':'free',ex:[]},rec)}
function eb(id){modal(S.bk.find(b=>b.id==id))}
function modal(b,rec){const isN=!b.id,o=(a,v)=>Object.entries(a).map(([k,x])=>`<option value="${k}" ${v==k?'selected':''}>${Array.isArray(x)?x[0]:x}</option>`).join('');
const el=document.createElement('div');el.className='mo';el.id='mo';el.innerHTML=`<div class="md"><h3>${isN?(rec?'定期レッスン登録':'新規予約'):'予約の編集'}</h3><input type="hidden" id="f_id" value="${b.id||''}"><div class="two"><div><label>利用日</label><input id="f_date" type="date" value="${b.date}" oninput="pv()"></div><div><label>利用部屋</label><select id="f_room" onchange="pv()">${S.rooms.map((r,i)=>`<option value="${i}" ${b.room==i?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div><label>開始(15分単位)</label><input id="f_s" type="time" step="900" value="${hm(b.s).padStart(5,'0')}" oninput="pv()"></div><div><label>終了</label><input id="f_e" type="time" step="900" value="${hm(b.e).padStart(5,'0')}" oninput="pv()"></div></div>
<label>予約区分</label><select id="f_cat" onchange="pv()">${o(CATS,b.cat)}</select><div class="two"><div><label>利用者名・団体名</label><input id="f_name" value="${esc(b.name||'')}"></div><div><label>講師名</label><input id="f_teacher" value="${esc(b.teacher||'')}"></div><div><label>レッスンコース</label><input id="f_course" value="${esc(b.course||'')}"></div><div><label>利用人数</label><input id="f_pp" type="number" min="1" value="${b.pp}" oninput="pv()"></div></div>
<label>ホール利用楽器・設備</label><div>${S.cfg.extras.map(x=>`<label style="display:inline-block;margin-right:10px"><input type="checkbox" class="fx" value="${esc(x.n)}" ${(b.ex||[]).includes(x.n)?'checked':''} onchange="pv()" style="width:auto"> ${esc(x.n)}</label>`).join('')}</div>
<div class="two"><div><label>割引額(円)</label><input id="f_disc" type="number" value="${b.disc||0}" oninput="pv()"></div><div><label>料金の手動修正(税抜・空欄=自動)</label><input id="f_adj" type="number" value="${b.adj??''}" oninput="pv()"></div><div><label>支払状況</label><select id="f_pay">${o(PAY,b.pay)}</select></div><div><label>予約状況</label><select id="f_st">${o(ST,b.st)}</select></div><div><label>連絡先(任意)</label><input id="f_tel" value="${esc(b.tel||'')}"></div><div><label>受付担当者</label><input id="f_staff" value="${esc(b.staff||'')}"></div></div><label>備考</label><input id="f_note" value="${esc(b.note||'')}">
${isN?`<div class="two"><div><label>繰り返し</label><select id="f_rep"><option value="0">なし</option><option value="7" ${rec?'selected':''}>毎週</option><option value="14">隔週</option></select></div><div><label>繰り返し終了日</label><input id="f_until" type="date" value="${addD(b.date,84)}"></div></div>`:''}
<div class="pv" id="pv"></div><p><button class="btn" onclick="saveB()">保存</button> <button class="btn g" onclick="$('#mo').remove()">閉じる</button> ${isN?'':`<button class="btn g" onclick="chSt('cancel')">キャンセル扱い</button> <button class="btn r" onclick="delB()">削除</button>${b.series?' <button class="btn r" onclick="delS()">この定期を全て削除</button>':''}`}</p></div>`;document.body.appendChild(el);el._b=b;pv()}
function rd(){const g=i=>$('#f_'+i).value,o=$('#mo')._b;return{...o,id:g('id')||undefined,date:g('date'),room:+g('room'),s:tm(g('s')),e:tm(g('e')),cat:g('cat'),name:g('name'),teacher:g('teacher'),course:g('course'),pp:Math.max(1,+g('pp')||1),ex:[...document.querySelectorAll('.fx:checked')].map(x=>x.value),disc:+g('disc')||0,adj:g('adj'),pay:g('pay'),st:g('st'),tel:g('tel'),staff:g('staff'),note:g('note'),sample:o.sample}}
function pv(){const b=rd(),c=calc(b),el=$('#pv');let w='';if(b.e<=b.s)w+='<div class="warn">終了時間は開始より後にしてください</div>';if(b.s<540||b.e>1260)w+='<div class="warn">9:00〜21:00の範囲外です</div>';const cf=conf(b);if(cf.length)w+=`<div class="warn">⚠ 重複:${cf.map(x=>hm(x.s)+'-'+hm(x.e)+' '+esc(x.name)).join('、')}</div>`;const h=hours(b.date);if(!h||b.s<h[0]||b.e>h[1])w+='<div class="warn">店舗営業時間外の予約です</div>';
el.innerHTML=`${w}利用時間 ${((b.e-b.s)/60).toFixed(2)}h ／ 基本 ${yen(c.base)} ／ 追加 ${yen(c.ex)}<br>税抜 <b>${yen(c.net)}</b> ／ 消費税 ${yen(c.tax)} ／ 税込 <b>${yen(c.tot)}</b>${b.cat=='lesson'||b.cat=='pass'?'<br><small>※通常レッスン・パスポートには貸出料金を適用しません</small>':''}`}
function saveB(){const b=rd();if(b.e<=b.s||b.s<540||b.e>1260)return alert('時間を確認してください');if(!b.name)return alert('利用者名・団体名を入力してください');
const h=hours(b.date);if((!h||b.s<h[0]||b.e>h[1])&&!confirm('店舗営業時間外です。登録しますか?'))return;
if(b.id){const cf=conf(b);if(cf.length)return alert('他の予約と重複しています');const i=S.bk.findIndex(x=>x.id==b.id);S.bk[i]=b;log('予約変更 '+b.date+' '+b.name)}
else{const rp=+$('#f_rep').value,ds=[b.date];if(rp){const u=$('#f_until').value;for(let d=addD(b.date,rp);d<=u;d=addD(d,rp))ds.push(d)}
const sid=rp?uid():undefined,ok=[],ng=[];ds.forEach(d=>{const x={...b,date:d,id:uid(),series:sid};if(S.cfg.closed.includes(d)||conf(x).length)ng.push(d);else ok.push(x)});
if(ng.length&&!confirm(`以下の日は休業日または重複のため登録されません:\n${ng.join(', ')}\n\n残り${ok.length}件を登録しますか?`))return;S.bk.push(...ok);log(`予約登録 ${b.name} ${ok.length}件`)}
save();$('#mo').remove();D=b.date;V='sched';render()}
function chSt(s){const b=$('#mo')._b;b.st=s;log('キャンセル '+b.name);save();$('#mo').remove();render()}
function delB(){const b=$('#mo')._b;if(!confirm('削除しますか?(元に戻せません。通常は「キャンセル扱い」を推奨)'))return;b.del=1;log('削除 '+b.date+' '+b.name);save();$('#mo').remove();render()}
function delS(){const b=$('#mo')._b;if(!confirm('この定期予約(今日以降)をすべて削除しますか?'))return;S.bk.forEach(x=>{if(x.series==b.series&&x.date>=today())x.del=1});log('定期削除 '+b.name);save();$('#mo').remove();render()}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function backup(){dl('jujido-backup-'+today()+'.json',JSON.stringify(S),'application/json')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.rooms||!x.bk)throw 0;if(confirm('現在のデータを置き換えますか?')){S=x;save();render()}}catch(e){alert('ファイルが不正です')}};r.readAsText(f)}
function csv(){const rows=[['日付','部屋','開始','終了','区分','利用者','人数','状況','支払','税抜','税込']];S.bk.filter(b=>!b.del).forEach(b=>{const c=calc(b);rows.push([b.date,S.rooms[b.room].name,hm(b.s),hm(b.e),CATS[b.cat][0],b.name,b.pp,ST[b.st],PAY[b.pay],c.net,c.tot])});dl('yoyaku.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
render();setInterval(()=>{if(V=='sched'&&!$('#mo'))render()},60000);
</script></body></html>
